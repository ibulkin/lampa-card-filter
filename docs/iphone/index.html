<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Пульт Lampa+</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><meta name="theme-color" content="#102522">
<style>
*{box-sizing:border-box}body{margin:0;background:#102522;color:#f8fcf9;font:18px -apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:500px;margin:12vh auto;padding:24px}h1{font-size:36px;letter-spacing:-1px}textarea,input,select,button{font:inherit;width:100%;padding:15px;border-radius:12px;border:1px solid #708782;margin:8px 0 20px}button{background:#b9f5cc;color:#123125;font-weight:650;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.5}label{display:block}
</style><main><h1>Пульт Lampa+</h1>
<form id="pair" hidden><label>Имя телевизора<input id="room" maxlength="48" placeholder="Например, Гостиная" required></label><button>Сохранить телевизор</button></form>
<form id="search" hidden><label>Телевизор<select id="devices"></select></label><label>Текст для телевизора<textarea id="query" rows="4" required placeholder="Введите или вставьте текст"></textarea></label><button id="paste">Вставить в открытое поле</button><button id="send" style="background:transparent;color:inherit">Искать на телевизоре</button></form>
<details><summary>Перенести привязку телевизоров</summary><p>Скопируйте привязку в Chrome, затем вставьте её в ярлыке на этом iPhone. Она даёт доступ к вашим телевизорам.</p><button type="button" id="export">Скопировать привязку</button><label>Привязка<textarea id="transfer" rows="2" autocomplete="off" spellcheck="false"></textarea></label><button type="button" id="import">Сохранить привязку</button></details><p id="notice" role="status"></p></main><script src="nacl.min.js"></script><script src="channel.js"></script><script src="phone.js?v=2"></script></html>
