<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Поиск Lampa+</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#102522;color:#f8fcf9;font:18px -apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:500px;margin:12vh auto;padding:24px}h1{font-size:36px;letter-spacing:-1px}input,select,button{font:inherit;width:100%;padding:15px;border-radius:12px;border:1px solid #708782;margin:8px 0 20px}button{background:#b9f5cc;color:#123125;font-weight:650;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.5}label{display:block}
</style><main><h1>Поиск Lampa+</h1>
<form id="pair" hidden><label>Имя телевизора<input id="room" maxlength="48" placeholder="Например, Гостиная" required></label><button>Сохранить телевизор</button></form>
<form id="search" hidden><label>Телевизор<select id="devices"></select></label><label>Название фильма или сериала<input id="query" type="search" maxlength="300" required placeholder="Введите или вставьте название"></label><button id="send">Искать на телевизоре</button></form>
<p id="notice" role="status"></p></main><script src="nacl.min.js"></script><script src="channel.js"></script><script src="phone.js"></script></html>
